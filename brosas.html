<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place an Order</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
        }

        header {
            background: #047857;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .order-container {
            max-width: 450px;
            width: 90%;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        h3 {
            color: #047857;
            margin-top: 25px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #047857;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #065f46;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 480px) {
            .order-container {
                padding: 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>EVSU-CC Online Ordering</h1>
        <p>Select your meal and quantity.</p>
    </header>

    <main class="order-container">

        <h2>Place Your Order</h2>

        <form id="orderForm">

            <label for="food">Select Food</label>
            <select id="food" required>
                <option value="">Choose a meal</option>
                <option value="75">Chicken Meal - ₱75</option>
                <option value="35">Pancit Canton - ₱35</option>
                <option value="40">Burger - ₱40</option>
                <option value="20">Iced Juice - ₱20</option>
            </select>

            <label for="quantity">Quantity</label>
            <input
                type="number"
                id="quantity"
                min="1"
                max="20"
                value="1"
                required
            >

            <h3>Total: <span id="total">₱0.00</span></h3>

            <button type="submit">Place Order</button>

            <p id="message" role="status"></p>

        </form>

    </main>

    <script>
        const orderForm = document.getElementById("orderForm");
        const food = document.getElementById("food");
        const quantity = document.getElementById("quantity");
        const total = document.getElementById("total");
        const message = document.getElementById("message");

        function calculateTotal() {
            const price = Number(food.value);
            const qty = Number(quantity.value);

            if (food.value !== "" && qty >= 1 && qty <= 20) {
                total.textContent = "₱" + (price * qty).toFixed(2);
            } else {
                total.textContent = "₱0.00";
            }
        }

        food.addEventListener("change", calculateTotal);
        quantity.addEventListener("input", calculateTotal);

        orderForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const qty = Number(quantity.value);

            if (food.value === "" || qty < 1 || qty > 20 || !Number.isInteger(qty)) {
                message.style.color = "red";
                message.textContent = "Please select a meal and valid quantity.";
                return;
            }

            const foodName = food.options[food.selectedIndex].text;

            message.style.color = "#047857";
            message.textContent =
                "Demo order created: " + qty + " x " + foodName +
                ". Total: " + total.textContent +
                ". This order has not been sent to the canteen.";
        });
    </script>
</body>
</html>
